<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel 成績登入表格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#16302A; --forest-2:#1F3F36; --card:#FFFFFF; --ink:#141414;
  --excel:#217346; --cell:#C6E0B4; --crest:#C8102E; --mist:#A9BDB4;
  --font:"Figtree","Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--forest);color:#fff;font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cell);outline-offset:2px}

/* 16:9 stage that fits the window */
.stage{position:absolute;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
  container-type:size;overflow:hidden;background:var(--forest)}

/* ---------- Opening: the finished form itself ---------- */
.intro{position:absolute;inset:0;background:url("assets/forest_202610211512.jpg") center/cover;display:grid;place-items:center}
.intro::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,25,20,.15),rgba(10,25,20,.55))}
.form{position:relative;z-index:1;width:26cqw;background:var(--card);color:var(--ink);padding:3.2cqh 2.6cqw 3.6cqh;
  display:grid;justify-items:center;gap:1.4cqh;box-shadow:0 2cqh 6cqh rgba(0,0,0,.35)}
.form img{width:7.5cqw;image-rendering:auto}
.form h1{font-size:2.6cqh;font-weight:800;letter-spacing:-.01em;text-align:center;line-height:1.25}
.form h1 small{display:block;font-size:1.7cqh;font-weight:500;color:#555;margin-top:.4cqh}
.fields{display:grid;grid-template-columns:auto 9cqw;gap:.9cqh .8cqw;align-items:center;margin:1cqh 0 1.2cqh;font-size:1.55cqh;color:#333}
.fields span:nth-child(odd){text-align:right}
.fields span:nth-child(even){background:var(--cell);height:2.3cqh;display:flex;align-items:center;padding:0 .6cqw;font-size:1.4cqh;color:#2c4a1f}
.pill{background:var(--ink);color:#fff;border-radius:99px;padding:1.2cqh 2.6cqw;font-weight:600;font-size:1.8cqh;transition:transform .15s}
.pill:hover{transform:translateY(-1px)}
.langpick{display:flex;gap:.4cqw;font-size:1.5cqh;color:#555}
.langpick button{padding:.4cqh .8cqw;border-radius:99px;border:1px solid #ccc;color:#333}
.langpick button[aria-pressed="true"]{background:var(--excel);border-color:var(--excel);color:#fff}

/* ---------- Lesson ---------- */
.lesson{position:absolute;inset:0;display:none;grid-template-rows:auto auto minmax(0,1fr) auto;padding:2.2cqh 2.4cqw 2.4cqh;gap:1.4cqh;
  background:radial-gradient(120% 90% at 30% 20%,var(--forest-2),var(--forest))}
.lesson.on{display:grid}
.progress{display:grid;grid-template-columns:repeat(16,1fr);gap:.35cqw}
.progress i{display:block;height:.75cqh;padding:.8cqh 0;margin:-.8cqh 0;background-clip:content-box;border-radius:2px;background-color:rgba(255,255,255,.2);cursor:pointer}
.progress i:hover{background-color:rgba(255,255,255,.45)}
.progress i.past{background:#3FA36B}
.progress i.cur{background:var(--cell);box-shadow:0 0 0 2px rgba(198,224,180,.35)}
.topbar{display:flex;align-items:center;gap:1.4cqw}
.stepno{font-weight:800;font-size:4.4cqh;color:var(--cell);font-variant-numeric:tabular-nums;line-height:1}
.stepno small{font-size:1.8cqh;color:var(--mist);font-weight:600}
.title{font-size:3.1cqh;font-weight:700;letter-spacing:-.01em;flex:1}
.tools{display:flex;align-items:center;gap:.8cqw;font-size:1.45cqh;color:var(--mist)}
.tools button{padding:.6cqh .8cqw;border-radius:6px;border:1px solid rgba(255,255,255,.18)}
.tools button[aria-pressed="true"]{background:rgba(198,224,180,.18);border-color:var(--cell);color:#fff}
.tools input[type=range]{width:7cqw;accent-color:var(--cell)}
.tools select{font:inherit;color:#fff;background:rgba(255,255,255,.08);padding:.6cqh .6cqw;border-radius:6px;border:1px solid rgba(255,255,255,.18);max-width:16cqw;cursor:pointer}
.tools select option{color:#000}
.screen{position:relative;min-height:0;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 21cqw;gap:1.2cqw;align-items:center}
.vwrap{position:relative;height:100%;max-width:100%;aspect-ratio:16/9;justify-self:center;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 1.5cqh 4cqh rgba(0,0,0,.4);cursor:zoom-in}
.vwrap.zoom{cursor:zoom-out}
.screen video{display:block;width:100%;height:100%;object-fit:contain;transition:transform .3s ease}
.vwrap.zoom video{transform:scale(2.2)}
.loading{position:absolute;inset:0;display:none;place-items:center;font-size:2.4cqh;font-weight:600;background:rgba(0,0,0,.45);pointer-events:none}
.vwrap.busy .loading{display:grid}
.zoomhint{position:absolute;top:1cqh;left:1cqh;font-size:1.3cqh;background:rgba(0,0,0,.6);padding:.3cqh .6cqw;border-radius:4px;pointer-events:none}
.enui{position:absolute;top:.8cqh;right:1cqh;max-width:70%;font-size:1.7cqh;font-weight:600;background:#217346;color:#fff;padding:.4cqh .8cqw;border-radius:4px;pointer-events:none;box-shadow:0 .4cqh 1.2cqh rgba(0,0,0,.4)}
.enui small{font-weight:500;opacity:.8;margin-right:.5cqw}
.path kbd small{display:block;font-size:1.15cqh;color:var(--mist);margin-top:.1cqh}
.tips{align-self:start;max-height:calc(100% - 17cqh);overflow:auto;display:grid;gap:.9cqh;font-size:1.6cqh;line-height:1.45}
.tips h3{font-size:1.5cqh;font-weight:700;color:var(--mist);letter-spacing:.04em}
.tips p{background:rgba(255,255,255,.07);border-left:4px solid var(--cell);padding:.8cqh .8cqw;border-radius:4px}
.tips p.warn{background:rgba(200,16,46,.18);border-left-color:#FF5A6E}
.tips p.warn::before{content:"⚠ ";color:#FF8A99;font-weight:700}
.thumb{position:absolute;right:0;bottom:0;width:15cqw;border:3px solid #fff;border-radius:6px;overflow:hidden;cursor:zoom-in;
  box-shadow:0 1cqh 3cqh rgba(0,0,0,.5);transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:5;background:#000}
.thumb img{display:block;width:100%}
.thumb figcaption{position:absolute;left:0;right:0;bottom:0;font-size:1.25cqh;padding:.4cqh .6cqw;background:rgba(0,0,0,.6)}
.thumb.big{position:fixed;inset:0;width:100%;height:100%;border:0;border-radius:0;cursor:zoom-out;display:grid;place-items:center;z-index:50;background:rgba(0,0,0,.92)}
.thumb.big img{width:auto;max-width:96%;max-height:92%}
.subtitle{position:absolute;left:0;right:22cqw;bottom:3cqh;display:flex;justify-content:center;pointer-events:none;z-index:4}
.subtitle p{font-size:2.6cqh;line-height:1.4;background:rgba(10,20,16,.82);padding:.7cqh 1.6cqw;border-radius:6px;max-width:62%;text-align:center}
.subtitle p:empty{display:none}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:1cqw}
.path{display:flex;flex-wrap:wrap;gap:.5cqw;align-items:center;font-size:1.6cqh;color:var(--mist)}
.path kbd{font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-bottom-width:3px;border-radius:6px;padding:.3cqh .7cqw}
.nav{display:flex;gap:.7cqw}
.nav button{padding:1cqh 1.6cqw;border-radius:99px;font-size:1.75cqh;font-weight:600;border:1px solid rgba(255,255,255,.3)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .go{background:var(--cell);color:var(--ink);border-color:var(--cell)}
.nav .go.wait{background:transparent;color:var(--mist);border-color:rgba(255,255,255,.3)}
.nav .finish{background:var(--crest);border-color:var(--crest);color:#fff}

/* ---------- Finish ---------- */
.done{position:absolute;inset:0;display:none;place-items:center;background:url("assets/forest_202610211512.jpg") center/cover}
.done.on{display:grid}
.done .form h1{font-size:3.4cqh}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- Full video ---------- */
.full{position:absolute;inset:0;z-index:70;display:none;grid-template-rows:auto minmax(0,1fr);gap:1.4cqh;padding:2.2cqh 2.4cqw 2.4cqh;background:rgba(8,18,14,.97)}
.full.on{display:grid}
.full header{display:flex;align-items:center;gap:1.2cqw}
.full h2{font-size:3cqh;font-weight:700;flex:1}
.full select{font:inherit;font-size:1.6cqh;color:#fff;background:rgba(255,255,255,.08);padding:.7cqh .8cqw;border-radius:6px;border:1px solid rgba(255,255,255,.18);max-width:28cqw;cursor:pointer}
.full select option{color:#000}
.full .close{padding:.9cqh 1.6cqw;border-radius:99px;font-size:1.7cqh;font-weight:600;border:1px solid rgba(255,255,255,.3)}
.full video{width:100%;height:100%;min-height:0;object-fit:contain;background:#000;border-radius:6px}
.tools .fullBtn,.fullPill{background:var(--cell);color:var(--ink);border-color:var(--cell);font-weight:600}
.fullPill{border-radius:99px;padding:.9cqh 2cqw;font-size:1.6cqh}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">

  <section class="intro" id="intro">
    <div class="form">
      <img src="assets/logo_202610211512.gif" alt="聖若瑟教區中學第五校校徽">
      <h1 data-t="introTitle"></h1>
      <div class="fields" aria-hidden="true">
        <span>Name</span><span>Sam</span>
        <span>Chinese</span><span>70</span>
        <span>English</span><span>80</span>
        <span>Math</span><span>90</span>
      </div>
      <div class="langpick" role="group" aria-label="Language">
        <button data-lang="en">English</button>
        <button data-lang="yue">廣東話</button>
      </div>
      <button class="pill" id="start" data-t="start"></button>
      <button class="fullPill" id="fullIntro" data-t="full"></button>
    </div>
  </section>

  <section class="lesson" id="lesson" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div class="topbar">
      <div class="stepno" id="stepno"></div>
      <h2 class="title" id="title"></h2>
      <div class="tools">
        <select id="jump" aria-label="Jump to step"></select>
        <button id="fullBtn" class="fullBtn" data-t="full"></button>
        <button id="langBtn" title="Language"></button>
        <button id="speedBtn" title="Video speed">1×</button>
        <button id="origBtn" aria-pressed="false" data-t="orig"></button>
        <button id="muteBtn" aria-pressed="false" data-t="music"></button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="0.35" aria-label="Music volume">
      </div>
    </div>
    <div class="screen">
      <div class="vwrap" id="vwrap">
        <video id="video" playsinline muted preload="auto"></video>
        <span class="zoomhint" data-t="zoom"></span>
        <span class="loading" data-t="loading"></span>
        <span class="enui" id="enui"></span>
      </div>
      <aside class="tips" id="tips"></aside>
      <figure class="thumb" id="thumb" tabindex="0" role="button">
        <img id="thumbImg" alt="">
        <figcaption data-t="result"></figcaption>
      </figure>
      <div class="subtitle"><p id="sub"></p></div>
    </div>
    <div class="bottom">
      <div class="path" id="path"></div>
      <div class="nav">
        <button id="prev" data-t="prev"></button>
        <button id="replay" data-t="replay"></button>
        <button id="next" class="go"></button>
      </div>
    </div>
  </section>

  <section class="done" id="done">
    <div class="form">
      <img src="assets/logo_202610211512.gif" alt="">
      <h1 data-t="doneTitle"></h1>
      <p style="font-size:1.8cqh;color:#444;text-align:center;max-width:20cqw;line-height:1.5" data-t="doneText"></p>
      <button class="pill" id="again" data-t="again"></button>
    </div>
  </section>
  <section class="full" id="full" role="dialog" aria-modal="true">
    <header>
      <h2 data-t="fullTitle"></h2>
      <select id="chapter" aria-label="Chapter"></select>
      <button class="close" id="fullClose" data-t="close"></button>
    </header>
    <video id="fullVideo" controls playsinline preload="metadata" src="full/Excel_Login_Full_202610221030.mp4"></video>
  </section>
  <canvas id="fx"></canvas>
</div>

le": {"en": "Make the white card", "yue": "整白色底卡"}, "clip": "clips/step03_202610221110.mp4", "thumb": "thumbs/step03_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s03_1_202610211512.mp3", "sub": "Select a block of cells and fill it white. This is our form card.", "dur": 6.31}, {"audio": "audio/en_s03_2_202610211512.mp3", "sub": "Change the column width (欄寬) so the card looks neat.", "dur": 3.98}], "yue": [{"audio": "audio/yue_s03_1_202610211512.mp3", "sub": "揀一片儲存格，填上白色，做表格嘅底卡。", "dur": 4.85}, {"audio": "audio/yue_s03_2_202610211512.mp3", "sub": "再調整欄寬，令張卡睇落整齊啲。", "dur": 4.32}]}, "tips": [{"warn": false, "en": "Select a big block of cells first, then fill white once.", "yue": "先揀一大片儲存格，一次過填白色。"}]}, {"id": 4, "start": 135, "end": 160, "path": "插入 › 圖片", "title": {"en": "Insert the school logo", "yue": "插入校徽"}, "clip": "clips/step04_202610221110.mp4", "thumb": "thumbs/step04_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s04_1_202610211512.mp3", "sub": "Go to Insert › Pictures (插入 › 圖片), and add the school logo.", "dur": 4.56}, {"audio": "audio/en_s04_2_202610211512.mp3", "sub": "Resize it and place it at the top of the card.", "dur": 3.94}], "yue": [{"audio": "audio/yue_s04_1_202610220931.mp3", "sub": "去「插入」，再按「圖片」，加入校徽。", "dur": 4.37}, {"audio": "audio/yue_s04_2_202610211512.mp3", "sub": "調好大細，放喺白卡上面。", "dur": 3.94}]}, "tips": [{"warn": false, "en": "The logo floats above the cells. Drag it freely.", "yue": "校徽浮喺儲存格上面，可以自由拖動。"}]}, {"id": 5, "start": 160, "end": 270, "path": "填滿色彩 › 淺綠　｜　列高", "title": {"en": "Labels and input cells", "yue": "標籤同輸入格"}, "clip": "clips/step05_202610221110.mp4", "thumb": "thumbs/step05_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s05_1_202610211512.mp3", "sub": "Type the labels: Name, Chinese, English and Math.", "dur": 4.78}, {"audio": "audio/en_s05_2_202610211512.mp3", "sub": "Fill the input cells next to them light green.", "dur": 3.91}, {"audio": "audio/en_s05_3_202610211512.mp3", "sub": "Adjust the row height (列高) to add space between the rows.", "dur": 4.22}], "yue": [{"audio": "audio/yue_s05_1_202610211512.mp3", "sub": "打入標籤：Name、Chinese、English 同 Math。", "dur": 4.92}, {"audio": "audio/yue_s05_2_202610211512.mp3", "sub": "旁邊嘅輸入格填上淺綠色。", "dur": 3.41}, {"audio": "audio/yue_s05_3_202610211512.mp3", "sub": "再調整列高，令每行之間有啲空位。", "dur": 4.34}]}, "tips": [{"warn": false, "en": "Remember where the 4 green cells are. The macro copies them later.", "yue": "記住四個綠色格嘅位置，之後巨集要複製佢哋。"}]}, {"id": 6, "start": 270, "end": 353, "path": "插入 › 圖案　｜　檢視 › 格線", "title": {"en": "Draw the Login button", "yue": "畫 Login 掣"}, "clip": "clips/step06_202610221110.mp4", "thumb": "thumbs/step06_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s06_1_202610211512.mp3", "sub": "Go to Insert › Shapes (插入 › 圖案), and draw a rounded rectangle.", "dur": 4.78}, {"audio": "audio/en_s06_2_202610211512.mp3", "sub": "Fill it black and type Login results.", "dur": 3.7}, {"audio": "audio/en_s06_3_202610211512.mp3", "sub": "On the View tab (檢視), turn off Gridlines (格線) for a clean look.", "dur": 4.56}], "yue": [{"audio": "audio/yue_s06_1_202610220931.mp3", "sub": "去「插入」，再按「圖案」，畫一個圓角矩形。", "dur": 4.66}, {"audio": "audio/yue_s06_2_202610211512.mp3", "sub": "填黑色，打上 Login results。", "dur": 3.36}, {"audio": "audio/yue_s06_3_202610211512.mp3", "sub": "喺「檢視」度剔走「格線」，畫面就乾淨好多。", "dur": 4.7}]}, "tips": [{"warn": false, "en": "The button is a shape. You link it to the macro in step 13.", "yue": "個掣只係一個圖案，第 13 步先會連去巨集。"}]}, {"id": 7, "start": 353, "end": 468, "path": "新增工作表 › Score　｜　第 2 列示範資料　｜　E2 =AVERAGE(B2:D2)", "title": {"en": "Set up the Score sheet", "yue": "設定 Score 工作表"}, "clip": "clips/step07_202610221110.mp4", "thumb": "thumbs/step07_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s07_1_202610211512.mp3", "sub": "Add a new sheet and name it Score.", "dur": 3.34}, {"audio": "audio/en_s07_2_202610211512.mp3", "sub": "In row 1, type Name, Chinese, English, Math and Mean.", "dur": 5.23}, {"audio": "audio/en_s07_x1_202610220919.mp3", "sub": "In row 2, type one sample record, for example A, 60, 70 and 80.", "dur": 6.74}, {"audio": "audio/en_s07_x2_202610220919.mp3", "sub": "In E2, type =AVERAGE(B2:D2). The macro needs this row, so don't skip it!", "dur": 8.64}, {"audio": "audio/en_s07_3_202610211512.mp3", "sub": "Then go back to the Form sheet and type some test data.", "dur": 4.3}], "yue": [{"audio": "audio/yue_s07_1_202610211512.mp3", "sub": "新增一個工作表，改名做 Score。", "dur": 4.1}, {"audio": "audio/yue_s07_2_202610211512.mp3", "sub": "第一列打 Name、Chinese、English、Math 同 Mean。", "dur": 5.52}, {"audio": "audio/yue_s07_x1_202610220919.mp3", "sub": "第二列先打一筆示範資料，例如 A、60、70、80。", "dur": 6.22}, {"audio": "audio/yue_s07_x2_202610220919.mp3", "sub": "喺 E2 打 =AVERAGE(B2:D2)。之後錄巨集一定要用到呢一列，千祈唔好漏！", "dur": 9.48}, {"audio": "audio/yue_s07_3_202610211512.mp3", "sub": "再返去 Form 工作表，輸入一組測試資料。", "dur": 4.73}]}, "tips": [{"warn": true, "en": "Score row 2 MUST have a sample record (A, 60, 70, 80) before you record.", "yue": "錄巨集之前，Score 第二列一定要有示範資料（A、60、70、80）。"}, {"warn": true, "en": "E2 must contain =AVERAGE(B2:D2).", "yue": "E2 一定要有 =AVERAGE(B2:D2)。"}, {"warn": false, "en": "Without row 2, Ctrl + ↓ jumps to row 1048576 and the paste fails.", "yue": "冇第二列，Ctrl + ↓ 會跳去第 1048576 列，貼上就會失敗。"}]}, {"id": 8, "start": 468, "end": 500, "path": "檔案 › 選項 › 自訂功能區 › 開發人員", "title": {"en": "Show the Developer tab", "yue": "開啟「開發人員」"}, "clip": "clips/step08_202610221110.mp4", "thumb": "thumbs/step08_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s08_1_202610211512.mp3", "sub": "To record a macro, we need the Developer tab.", "dur": 4.22}, {"audio": "audio/en_s08_2_202610211512.mp3", "sub": "Go to File › Options › Customize Ribbon (檔案 › 選項 › 自訂功能區), and tick Developer (開發人員).", "dur": 5.28}], "yue": [{"audio": "audio/yue_s08_1_202610211512.mp3", "sub": "要錄巨集，先要開「開發人員」索引標籤。", "dur": 4.68}, {"audio": "audio/yue_s08_2_202610211512.mp3", "sub": "去「檔案」、「選項」、「自訂功能區」，剔「開發人員」。", "dur": 6.1}]}, "tips": [{"warn": false, "en": "You only need to do this once on each computer.", "yue": "每部電腦只需要做一次。"}]}, {"id": 9, "start": 500, "end": 532, "path": "開發人員 › 錄製巨集", "title": {"en": "Start recording the macro", "yue": "開始錄製巨集"}, "clip": "clips/step09_202610221110.mp4", "thumb": "thumbs/step09_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s09_x3_202610220919.mp3", "sub": "Before you record, check that row 2 of the Score sheet has the sample record.", "dur": 5.88}, {"audio": "audio/en_s09_1_202610211512.mp3", "sub": "On the Developer tab, click Record Macro (錄製巨集).", "dur": 4.1}, {"audio": "audio/en_s09_2_202610211512.mp3", "sub": "Name it Test and click OK. From now on, Excel records every step.", "dur": 6.89}, {"audio": "audio/en_s09_x2_202610220919.mp3", "sub": "While recording, every click is saved. Do not click anything extra.", "dur": 6.58}, {"audio": "audio/en_s09_3_202610211512.mp3", "sub": "First, select the four input cells and copy them.", "dur": 4.58}, {"audio": "audio/en_s09_x1_202610220919.mp3", "sub": "Select only the four green cells, not the labels. The status bar should show Count 4.", "dur": 7.73}], "yue": [{"audio": "audio/yue_s09_x3_202610220919.mp3", "sub": "錄之前，先睇清楚 Score 第二列係咪已經有示範資料。", "dur": 5.59}, {"audio": "audio/yue_s09_1_202610220931.mp3", "sub": "喺「開發人員」按「錄製巨集」。", "dur": 3.82}, {"audio": "audio/yue_s09_2_202610220931.mp3", "sub": "巨集名稱打 Test，按確定。由而家開始，Excel 會記低你每一個動作。", "dur": 8.11}, {"audio": "audio/yue_s09_x2_202610220931.mp3", "sub": "錄緊嘅時候，你每一下按滑鼠都會被記低，唔好亂按。", "dur": 5.95}, {"audio": "audio/yue_s09_3_202610211512.mp3", "sub": "首先揀四個輸入格，複製。", "dur": 3.62}, {"audio": "audio/yue_s09_x1_202610220919.mp3", "sub": "只揀四個綠色格，唔好揀埋標籤。下面狀態列應該顯示「計數：4」。", "dur": 8.71}]}, "tips": [{"warn": true, "en": "Check first: Score row 2 has data, and E2 has the formula.", "yue": "開始前檢查：Score 第二列有資料，E2 有公式。"}, {"warn": false, "en": "Macro name: Test (no spaces). Store in: This Workbook (此活頁簿).", "yue": "巨集名稱：Test（唔好有空格）；儲存於：此活頁簿。"}, {"warn": true, "en": "Every click is recorded. Move slowly. Do not use Ctrl + Z.", "yue": "每一下都會被錄低，慢慢做，唔好用 Ctrl + Z。"}, {"warn": false, "en": "Select only the 4 green cells. Status bar shows Count: 4.", "yue": "只揀四個綠色格，狀態列會顯示「計數：4」。"}]}, {"id": 10, "start": 532, "end": 600, "path": "A1 › Ctrl + ↓　｜　以相對位置錄製 › ↓　｜　選擇性貼上 › 值 + 轉置", "title": {"en": "Paste into the Score sheet", "yue": "貼去 Score 工作表"}, "clip": "clips/step10_202610221110.mp4", "thumb": "thumbs/step10_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s10_1_202610211512.mp3", "sub": "Go to the Score sheet and click cell A1.", "dur": 3.74}, {"audio": "audio/en_s10_x2_202610220919.mp3", "sub": "Make sure Use Relative References is still off when you click A1.", "dur": 5.16}, {"audio": "audio/en_s10_2_202610211512.mp3", "sub": "Press Control and the Down Arrow to jump to the last record.", "dur": 4.66}, {"audio": "audio/en_s10_3_202610211512.mp3", "sub": "Turn on Use Relative References (以相對位置錄製), then move down one row.", "dur": 4.92}, {"audio": "audio/en_s10_4_202610211512.mp3", "sub": "Right-click, choose Paste Special (選擇性貼上), and tick Transpose (轉置).", "dur": 4.61}, {"audio": "audio/en_s10_x1_202610220919.mp3", "sub": "In Paste Special, choose Values (值) and tick Transpose (轉置). You need both.", "dur": 7.01}], "yue": [{"audio": "audio/yue_s10_1_202610220931.mp3", "sub": "去 Score 工作表，按 A1。", "dur": 3.14}, {"audio": "audio/yue_s10_x2_202610220931.mp3", "sub": "按 A1 嗰陣，「以相對位置錄製」一定要仲未開。", "dur": 5.16}, {"audio": "audio/yue_s10_2_202610220931.mp3", "sub": "按 Control 加向下鍵，跳去最後一筆紀錄。", "dur": 4.66}, {"audio": "audio/yue_s10_3_202610211512.mp3", "sub": "開「以相對位置錄製」，再向下移一格。", "dur": 4.46}, {"audio": "audio/yue_s10_4_202610220931.mp3", "sub": "按右鍵，揀「選擇性貼上」，剔「轉置」。", "dur": 5.16}, {"audio": "audio/yue_s10_x1_202610220919.mp3", "sub": "喺「選擇性貼上」入面，揀「值」，再剔「轉置」，兩樣都要。", "dur": 5.98}]}, "tips": [{"warn": true, "en": "Order matters: A1 → Ctrl + ↓ → turn ON Relative → ↓ once.", "yue": "次序好重要：A1 → Ctrl + ↓ → 開「以相對位置錄製」→ ↓ 一下。"}, {"warn": true, "en": "Paste Special: choose Values (值) AND tick Transpose (轉置).", "yue": "選擇性貼上：揀「值」，再剔「轉置」，兩樣都要。"}, {"warn": false, "en": "Relative button looks highlighted (grey) when it is ON.", "yue": "「以相對位置錄製」開咗會變灰色（highlight）。"}]}, {"id": 11, "start": 600, "end": 634, "path": "=AVERAGE(B3:D3)", "title": {"en": "Calculate the mean", "yue": "計平均分"}, "clip": "clips/step11_202610221110.mp4", "thumb": "thumbs/step11_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s11_1_202610211512.mp3", "sub": "Fill the AVERAGE formula down to the new row to get the mean.", "dur": 4.68}, {"audio": "audio/en_s11_x2_202610220919.mp3", "sub": "Click the last cell with the formula in column E, then drag the small square down one row.", "dur": 6.41}, {"audio": "audio/en_s11_2_202610211512.mp3", "sub": "Then turn off Use Relative References.", "dur": 3.72}, {"audio": "audio/en_s11_x1_202610220919.mp3", "sub": "Turn it off before you go back to the Form sheet, or the wrong cells will be cleared.", "dur": 5.71}], "yue": [{"audio": "audio/yue_s11_1_202610211512.mp3", "sub": "將 AVERAGE 公式向下填到新嗰列，計出平均分。", "dur": 5.11}, {"audio": "audio/yue_s11_x2_202610220931.mp3", "sub": "按 E 欄最後一格有公式嘅格，拖佢右下角嘅小方點，向下拉一格。", "dur": 6.67}, {"audio": "audio/yue_s11_2_202610211512.mp3", "sub": "然後閂返「以相對位置錄製」。", "dur": 4.3}, {"audio": "audio/yue_s11_x1_202610220919.mp3", "sub": "一定要喺返去 Form 之前閂咗佢，唔係就會清錯位置。", "dur": 5.71}]}, "tips": [{"warn": false, "en": "Drag the small square at the bottom-right of the formula cell down 1 row.", "yue": "拖公式格右下角嘅小方點，向下一格就夠。"}, {"warn": true, "en": "Turn OFF Relative References before going back to Form.", "yue": "返去 Form 之前，一定要閂「以相對位置錄製」。"}]}, {"id": 12, "start": 634, "end": 668, "path": "常用 › 清除 › 清除內容　｜　停止錄製", "title": {"en": "Clear the form and stop", "yue": "清空表格，停止錄製"}, "clip": "clips/step12_202610221110.mp4", "thumb": "thumbs/step12_202610211512.jpg", "lines": {"en": [{"audio": "audio/en_s12_1_202610211512.mp3", "sub": "Go back to the Form sheet.", "dur": 2.93}, {"audio": "audio/en_s1 /* ---------- Music: generated with Web Audio, looping ---------- */
let ac, musicGain, master, musicTimer, musicOn = true, beat = 0;
const BPM = 112, SPB = 60/BPM;
const CHORDS = [[60,64,67],[67,71,74],[69,72,76],[65,69,72]]; // C G Am F
function initAudio(){
  if(ac) return;
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = +$("vol").value; musicGain.connect(master);
}
const hz = m => 440*Math.pow(2,(m-69)/12);
function pluck(t,m,len,vol,type="triangle"){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0008,t+len);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+len+0.05);
}
function hat(t,vol){
  const b=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  f.type="highpass"; f.frequency.value=7000; g.gain.value=vol;
  s.buffer=b; s.connect(f); f.connect(g); g.connect(musicGain); s.start(t);
}
function kick(t){
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(45,t+0.15);
  g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22);
}
let nextT = 0;
function scheduler(){
  while(nextT < ac.currentTime + 0.25){
    const bar = Math.floor(beat/8)%4, ch = CHORDS[bar], e = beat%8;
    if(e%4===0) kick(nextT);
    hat(nextT, e%2 ? 0.05 : 0.025);
    const arp = [0,1,2,1,0,2,1,2][e];
    pluck(nextT, ch[arp]+12, SPB*0.9, 0.08);
    if(e===0){ pluck(nextT, ch[0]-12, SPB*3.5, 0.12, "sine"); }
    nextT += SPB/2; beat++;
  }
}
function startMusic(){
  initAudio(); ac.resume();
  nextT = ac.currentTime + 0.05;
  clearInterval(musicTimer); musicTimer = setInterval(scheduler, 60);
}
function setMusicLevel(){
  if(!musicGain) return;
  const base = musicOn && !$("full").classList.contains("on") ? +$("vol").value : 0;
  const duck = voice.paused ? 1 : 0.35;               // quieter while narration plays
  musicGain.gain.setTargetAtTime(base*duck, ac.currentTime, 0.15);
}

const XL = {"Excel 啟用巨集的活頁簿":"Excel Macro-Enabled Workbook","以相對位置錄製":"Use Relative References","自訂功能區":"Customize Ribbon",

const XL_KEYS = Object.keys(XL).sort((a,b)=>b.length-a.length);

const addEn = t => t.replace(/「([^」]+)」/g, (m,k)=> XL[k] ? `「${k} ${XL[k]}」` : m);
function render(){
  const s = STEPS[cur];

function playStep(){
  const my = ++token, s = STEPS[cur];

}
function finishCheck(){ updateNext(); }
video.addEventListener("ended", ()=>{ videoDone = true; finishCheck(); });

["playing","canplay","error"].forEach(ev=>video.addEventListener(ev, ()=>$("vwrap").classList.remove("busy")));
function stopAll(){ token++; voice.pause(); voice.onended=null; video.pause(); setMusicLevel(); }
function go(i){ stopAll(); cur = Math.max(0, Math.min(STEPS.length-1, i)); playStep(); }

/* Full video: local file, chapters follow the step start times */
const fullVideo = $("fullVideo");
const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;

/* ---------- Finish: confetti + generated fanfare ---------- */
function finish(){

  if(ac){ const t=ac.currentTime+0.05; [72,76,79,84].forEach((m,i)=>pluck(t+i*0.11,m,0.6,0.22,"square"));

    w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function tick(){ cx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=H*.0006;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w*devicePixelRatio,p.h*devicePixelRatio);cx.restore();});
    if(++f<260) requestAnimationFrame(tick); else cx.clearRect(0,0,W,H); })();
}

buildProgress(); applyLang();
</script>
